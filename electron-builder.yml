appId: com.checkoutnow.cheko
productName: Cheko POS
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  shortcutName: Cheko POS
npmRebuild: false
extraResources:
  - broadcast-sidecar/**/*
  - vendor/checkout_broadcast/sdk/python/**/*

# Temporary HTTP vhost for initial certbot issuance (replace with redirect vhost after TLS).
<VirtualHost *:80>
    ServerName cheko.check-outnow.com

    DocumentRoot /var/www/cheko/dist

    <Directory /var/www/cheko/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cheko_checkoutnow_error.log
    CustomLog ${APACHE_LOG_DIR}/cheko_checkoutnow_access.log combined
</VirtualHost>

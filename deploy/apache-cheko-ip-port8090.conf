# Direct IP access (no hostname): http://75.119.139.18:8090/
Listen 8090
<VirtualHost *:8090>
    DocumentRoot /var/www/cheko/dist

    <Directory /var/www/cheko/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cheko_ip8090_error.log
    CustomLog ${APACHE_LOG_DIR}/cheko_ip8090_access.log combined
</VirtualHost>

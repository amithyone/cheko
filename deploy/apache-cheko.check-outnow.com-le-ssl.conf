<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cheko.check-outnow.com

    DocumentRoot /var/www/cheko/dist

    <Directory /var/www/cheko/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cheko_checkoutnow_error.log
    CustomLog ${APACHE_LOG_DIR}/cheko_checkoutnow_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/cheko.check-outnow.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cheko.check-outnow.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
